<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent popup · test board</title>
<style>
  :root { --bg:#f5f2ec; --fg:#1d1b18; --muted:#6d675e; --card:#fffdf8; --line:#ddd6c8; --accent:#c2410c; --ok:#15803d; --run:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#161411; --fg:#f1ece2; --muted:#a39b8d; --card:#1f1c18; --line:#3a352d; --accent:#fb923c; --ok:#4ade80; --run:#93c5fd; }
  }
  :root[data-theme="dark"] { --bg:#161411; --fg:#f1ece2; --muted:#a39b8d; --card:#1f1c18; --line:#3a352d; --accent:#fb923c; --ok:#4ade80; --run:#93c5fd; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 "Noto Sans Thai", system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  header .status { color:var(--muted); font-size:13px; }
  header .actions { display:flex; gap:8px; }
  button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #board { position:relative; height:calc(100vh - 62px); min-height:520px; overflow:hidden; touch-action:none; }
  .card { position:absolute; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:0 6px 18px rgba(0,0,0,.08); cursor:grab; user-select:none; min-width:0; }
  .card.main { width:340px; padding:16px; }
  .card.sub { width:170px; }
  .card.dragging { cursor:grabbing; z-index:10; box-shadow:0 14px 34px rgba(0,0,0,.2); }
  .card .top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .logo { width:34px; height:34px; display:grid; place-items:center; flex:none; }
  .logo img { width:100%; height:100%; object-fit:contain; }
  :root:not([data-theme="light"]) .logo img, :root[data-theme="dark"] .logo img { filter:invert(1); }
  .chip { font-size:12px; font-weight:700; padding:4px 8px; border-radius:999px; background:var(--fg); color:var(--bg); white-space:nowrap; }
  .kind { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .name { font-weight:800; margin-top:8px; font-size:18px; overflow-wrap:anywhere; }
  .card.sub .name { font-size:14px; }
  .label { color:var(--muted); font-size:13px; margin-top:4px; overflow-wrap:anywhere; }
  .card.sub .label { font-size:12px; }
  .foot { display:flex; align-items:center; gap:6px; margin-top:10px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--run); }
  .card.done .dot { background:var(--ok); }
  .card.running .dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .card.done { opacity:.7; }
  .empty { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); color:var(--muted); text-align:center; }
  .hint { position:absolute; left:16px; bottom:12px; color:var(--muted); font-size:12px; }
  @media (prefers-reduced-motion: reduce) { .card.running .dot { animation:none; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Agent popup · ทดสอบ</h1>
    <div class="status" id="status">กำลังเชื่อมต่อ...</div>
  </div>
  <div class="actions">
    <button id="arrange" title="ล้างตำแหน่งที่ลากไว้แล้วจัดเรียงใหม่">จัดเรียงอัตโนมัติ</button>
    <button id="clear" title="ล้าง event ทั้งหมดที่ server">ล้างกระดาน</button>
  </div>
</header>
<div id="board">
  <div class="empty" id="empty">ยังไม่มีเอเจนต์<br><small>รัน <code>python3 prototype/agent-popup/sim.py</code> เพื่อทดสอบ</small></div>
  <div class="hint">ลากการ์ดเพื่อย้าย ตำแหน่งจะถูกจำไว้ในเบราว์เซอร์นี้</div>
</div>

<script>
const board = document.getElementById('board');
const statusEl = document.getElementById('status');
const emptyEl = document.getElementById('empty');
const KEY = 'agentPopup.pos.v1';
const cards = new Map();
let manifest = null;
let drag = null;
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { saved = {}; }
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch {} };

fetch('/logos.json').then(r => r.json()).then(m => { manifest = m; }).catch(() => {});

// Model id -> display name and logo id in the simple-icons set (null = text chip).
const MODELS = {
  'claude-opus-5-5':   { name: 'Opus 5.5',   logo: 'claude' },
  'claude-sonnet-5-5': { name: 'Sonnet 5.5', logo: 'claude' },
  'claude-haiku-5-5':  { name: 'Haiku 5.5',  logo: 'claude' },
  'claude-fable-5-1':  { name: 'Fable 5.1',  logo: 'claude' },
};
function modelInfo(model) {
  if (MODELS[model]) return MODELS[model];
  if (/gpt|chatgpt|openai/i.test(model)) return { name: model, logo: null };
  return { name: model, logo: null };
}

function logoEl(info) {
  const box = document.createElement('div');
  box.className = 'logo';
  const chip = () => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = info.name.split(' ')[0]; return c; };
  if (info.logo && manifest) {
    const img = document.createElement('img');
    img.alt = info.name;
    img.src = manifest.base + info.logo + '.svg';
    img.onerror = () => { box.replaceChildren(chip()); };
    box.append(img);
  } else {
    box.append(chip());
  }
  return box;
}

function makeCard(a) {
  const el = document.createElement('div');
  el.dataset.id = a.id;
  el.innerHTML = '<div class="top"><span class="logo"></span><span class="kind"></span></div>' +
                 '<div class="name"></div><div class="label"></div>' +
                 '<div class="foot"><span class="dot"></span><span class="time"></span></div>';
  el.addEventListener('pointerdown', onDown);
  board.append(el);
  cards.set(a.id, el);
  return el;
}

function updateCard(el, a) {
  el.className = `card ${a.kind} ${a.state}`;
  if (el.dataset.model !== a.model) {
    el.dataset.model = a.model;
    const info = modelInfo(a.model);
    el.querySelector('.logo').replaceWith(logoEl(info));
    el.querySelector('.name').textContent = info.name;
  }
  el.querySelector('.kind').textContent = a.kind === 'main' ? 'เอเจนต์หลัก' : 'sub-agent';
  el.querySelector('.label').textContent = a.label || '';
  const end = a.ended ? a.ended : Date.now() / 1000;
  const secs = Math.max(0, Math.round(end - a.started));
  el.querySelector('.time').textContent = (a.state === 'done' ? 'เสร็จใน ' : 'ทำงาน ') + secs + 's';
}

// Auto layout: main agents across the top, sub-agents in a grid below.
function autoSlot(a, idx, W) {
  if (a.kind === 'main') {
    const per = 360;
    const cols = Math.max(1, Math.floor((W - 12) / per));
    return { x: 12 + (idx % cols) * per, y: 14 + Math.floor(idx / cols) * 190 };
  }
  const cell = 184;
  const cols = Math.max(1, Math.floor((W - 12) / cell));
  return { x: 12 + (idx % cols) * cell, y: 300 + Math.floor(idx / cols) * 140 };
}

function clampToBoard(el, x, y) {
  const maxX = Math.max(0, board.clientWidth - el.offsetWidth);
  const maxY = Math.max(0, board.clientHeight - el.offsetHeight);
  return { x: Math.min(Math.max(0, x), maxX), y: Math.min(Math.max(0, y), maxY) };
}

function place(el, id, x, y) {
  const p = clampToBoard(el, x, y);
  el.style.left = p.x + 'px';
  el.style.top = p.y + 'px';
}

// Drag and drop: free movement, position saved per card.
function onDown(e) {
  const el = e.currentTarget;
  const r = el.getBoundingClientRect();
  const b = board.getBoundingClientRect();
  drag = { el, id: el.dataset.id, dx: e.clientX - r.left, dy: e.clientY - r.top, bx: b.left, by: b.top };
  el.setPointerCapture(e.pointerId);
  el.classList.add('dragging');
  el.style.zIndex = 10;
  e.preventDefault();
}
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const p = clampToBoard(drag.el, e.clientX - drag.bx - drag.dx, e.clientY - drag.by - drag.dy);
  drag.el.style.left = p.x + 'px';
  drag.el.style.top = p.y + 'px';
});
function endDrag() {
  if (!drag) return;
  const { el, id } = drag;
  saved[id] = { x: parseInt(el.style.left, 10), y: parseInt(el.style.top, 10) };
  persist();
  el.classList.remove('dragging');
  el.style.zIndex = '';
  drag = null;
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

async function refresh() {
  let agents;
  try {
    agents = (await (await fetch('/agents', { cache: 'no-store' })).json()).agents;
  } catch {
    statusEl.textContent = 'เซิร์ฟเวอร์ไม่ตอบ: รัน server.py ก่อน';
    return;
  }
  const ids = new Set(agents.map((a) => a.id));
  for (const [id, el] of cards) {
    if (!ids.has(id)) { el.remove(); cards.delete(id); }
  }
  const W = board.clientWidth;
  const counters = { main: 0, sub: 0 };
  for (const a of agents) {
    const el = cards.get(a.id) || makeCard(a);
    updateCard(el, a);
    const slot = autoSlot(a, counters[a.kind]++, W);
    if (drag && drag.id === a.id) continue;
    if (saved[a.id]) place(el, a.id, saved[a.id].x, saved[a.id].y);
    else place(el, a.id, slot.x, slot.y);
  }
  emptyEl.hidden = agents.length > 0;
  const running = agents.filter((a) => a.state === 'running').length;
  const subs = agents.filter((a) => a.kind === 'sub').length;
  statusEl.textContent = agents.length
    ? `เอเจนต์ ${agents.length - subs} ตัว · sub-agent ${subs} ตัว · ทำงานอยู่ ${running} ตัว`
    : 'ยังไม่มีเอเจนต์';
}

document.getElementById('arrange').onclick = () => {
  saved = {};
  persist();
  for (const el of cards.values()) el.dataset.placed = '';
  refresh();
};
document.getElementById('clear').onclick = async () => {
  await fetch('/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'reset' }) });
  refresh();
};
window.addEventListener('resize', refresh);

refresh();
setInterval(refresh, 400);
</script>
</body>
</html>
