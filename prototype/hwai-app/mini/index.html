<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'self' blob: mediastream:; worker-src blob:"
    />
    <title>hwAI</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Noto+Sans+Thai:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="/mini/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <span class="bar-title">hwAI</span>
        <button id="open-settings" class="icon-btn" type="button" aria-label="ตั้งค่า" title="ตั้งค่า">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.2 4.6.1-1.1-.1-1.1 2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.9-1.1L15.6 3h-4l-.4 2.7a8 8 0 0 0-1.9 1.1l-2.4-1-2 3.4 2 1.6-.1 1.1.1 1.1-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.9 1.1l.4 2.7h4l.4-2.7a8 8 0 0 0 1.9-1.1l2.4 1 2-3.4-2-1.6Z" /></svg>
        </button>
      </header>

      <!-- Home -->
      <main id="home" class="view">
        <section class="hero">
          <div id="mascot-ring" class="mascot-ring">
            <img id="mascot" alt="Jason" src="/assets/jason/line/jason-line-neutral.svg" />
          </div>
          <p id="say" class="say">วันนี้มาไหว้กันนะ</p>
        </section>

        <div class="mode" role="group" aria-label="โหมด">
          <button id="mode-real" class="seg" type="button" title="ต้องไหว้ก่อนเอเจนต์จะทำงาน">🙏 โหมดจริง</button>
          <button id="mode-demo" class="seg" type="button" title="ปล่อยผ่านทุกอย่าง ไว้ดูตัวอย่าง">▶︎ สาธิต</button>
        </div>

        <section id="cam-card" class="cam-card">
          <div class="stage">
            <video id="video" playsinline muted></video>
            <canvas id="overlay"></canvas>
            <div id="cam-off" class="cam-off">
              <span class="cam-emoji" aria-hidden="true">📷</span>
              <button id="cam-start" class="btn primary" type="button">เปิดกล้อง</button>
            </div>
            <span id="level-chip" class="level-chip" hidden>-</span>
            <div id="ring" class="ring" hidden>
              <svg viewBox="0 0 40 40" aria-hidden="true">
                <circle class="ring-bg" cx="20" cy="20" r="16" />
                <circle id="ring-fg" class="ring-fg" cx="20" cy="20" r="16" />
              </svg>
              <span id="score">0</span>
            </div>
          </div>
        </section>

        <section class="meter" aria-label="ระดับการไหว้">
          <div id="levels" class="levels">
            <span data-level="0">ไม่ไหว้</span>
            <span data-level="1">เพื่อน</span>
            <span data-level="2">ผู้ใหญ่</span>
            <span data-level="3">พระ</span>
          </div>
          <div class="hold"><i id="hold-bar"></i></div>
          <p id="hint" class="hint">เปิดกล้องแล้วพนมมือให้ชิดกันนะ</p>
        </section>

        <section class="gate">
          <span class="pill"><b id="credits">0</b> เครดิต</span>
          <span class="pill"><b id="queued">0</b> รอไหว้</span>
          <span class="pill"><b id="pass-min">70</b> เกณฑ์</span>
        </section>

        <ul id="agents" class="agents"></ul>

        <footer class="actions">
          <button id="calib" class="btn" type="button" disabled title="ยืนตรงมองกล้องแล้วกด (C)">ตั้งศูนย์</button>
          <button id="cam-stop" class="btn" type="button" disabled>ปิดกล้อง</button>
        </footer>
      </main>

      <!-- Settings -->
      <section id="settings" class="view settings" hidden>
        <h2>ตั้งค่า</h2>

        <div class="group">
          <h3>หน้าตา</h3>
          <div class="row">
            <span>ธีม</span>
            <div class="seg-group" data-pref="theme">
              <button type="button" data-value="auto">อัตโนมัติ</button>
              <button type="button" data-value="light">สว่าง</button>
              <button type="button" data-value="dark">มืด</button>
            </div>
          </div>
          <div class="row">
            <span>สีหลัก</span>
            <div id="swatches" class="swatches"></div>
          </div>
          <div class="row">
            <span>Jason ในป๊อปอัพ</span>
            <div class="seg-group" data-pref="mascotSize">
              <button type="button" data-value="s">เล็ก</button>
              <button type="button" data-value="m">กลาง</button>
              <button type="button" data-value="l">ใหญ่</button>
            </div>
          </div>
          <label class="row"><span>กล่องข้อความในป๊อปอัพ</span><input class="switch" type="checkbox" data-pref="bubbles" /></label>
          <label class="row"><span>แสดงกล้องในหน้าต่างนี้</span><input class="switch" type="checkbox" data-pref="showCamera" /></label>
          <label class="row"><span>ลอยอยู่บนสุด</span><input class="switch" type="checkbox" data-pref="alwaysOnTop" /></label>
        </div>

        <div class="group">
          <h3>การไหว้</h3>
          <label class="slider">
            <span>เกณฑ์คะแนนผ่าน <output id="pass-min-out">70</output></span>
            <input id="pass-min-input" type="range" min="30" max="95" step="5" />
          </label>
          <label class="slider">
            <span>ค้างท่า <output id="hold-out">0.7 วิ</output></span>
            <input id="hold-input" type="range" min="300" max="2000" step="100" />
          </label>
        </div>

        <div class="group">
          <h3>ทดสอบ</h3>
          <div class="btn-row">
            <button id="sim" class="btn" type="button">จำลองเซสชัน</button>
            <button id="fake-pass" class="btn" type="button">จำลองไหว้ผ่าน</button>
          </div>
          <a class="link" href="/lab/" target="_blank" rel="noopener">เปิดหน้าละเอียด (Lab) ↗</a>
        </div>

        <button id="close-settings" class="btn primary wide" type="button">เสร็จ</button>
      </section>
    </div>
    <script type="module" src="/mini/app.js"></script>
  </body>
</html>
