<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: https://cdn.jsdelivr.net data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Agent popup</title>
    <style>
      /* Transparent GUI overlay: no panel, just the characters and their bubbles.
     The whole window is the drag handle. */
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font:
          12px/1.35 -apple-system,
          "Noto Sans Thai",
          system-ui,
          sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: relative;
        -webkit-app-region: drag;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        padding: 10px 12px 12px;
        width: 360px;
        box-sizing: border-box;
      }
      .group {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        width: 100%;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        position: relative;
      }
      .jason img {
        display: block;
        filter: invert(1) drop-shadow(0 0 1px rgba(0, 0, 0, 0.7))
          drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
      }
      .big img {
        width: 112px;
        height: 112px;
      }
      .small img {
        width: 46px;
        height: 46px;
      }
      .bubble {
        position: relative;
        max-width: 230px;
        padding: 6px 10px;
        border-radius: 14px;
        background: rgba(20, 18, 16, 0.62);
        border: 1.5px solid #fff;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        overflow-wrap: anywhere;
      }
      .bubble::after {
        content: "";
        position: absolute;
        right: -7px;
        top: 50%;
        width: 10px;
        height: 10px;
        transform: translateY(-50%) rotate(45deg);
        background: rgba(20, 18, 16, 0.62);
        border-right: 1.5px solid #fff;
        border-bottom: 1.5px solid #fff;
      }
      .bubble.small {
        font-size: 11px;
        max-width: 180px;
        padding: 4px 8px;
      }
      .bubble b {
        font-weight: 800;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        opacity: 0.92;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      .who .chip {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 999px;
        background: #fff;
        color: #1d1b18;
      }
      .who img {
        width: 14px;
        height: 14px;
        filter: invert(1);
      }
      .time {
        opacity: 0.75;
        font-variant-numeric: tabular-nums;
      }
      .quit {
        -webkit-app-region: no-drag;
        position: absolute;
        top: -4px;
        left: -4px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid #fff;
        background: rgba(20, 18, 16, 0.6);
        color: #fff;
        font: 12px/1 system-ui;
        cursor: pointer;
        display: none;
        padding: 0;
      }
      #stage:hover .quit {
        display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="renderer.js"></script>
  </body>
</html>
